[bar.default]
background_opacity = 0.4999999888241291
capsule = true
capsule_opacity = 0.0
capsule_padding = 5.0
center = [ "network_rx", "network_tx", "notifications", "clock" ]
end = [
    "media",
    "tray",
    "status",
    "network",
    "bluetooth",
    "volume",
    "input_volume",
    "brightness",
    "weather",
    "battery",
    "session"
]
start = [ "launcher", "theme_mode", "wallpaper", "group:g1", "keybinds", "workspaces" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "ram", "sysmon", "cpu" ]
    opacity = 0.0
    padding = 6.0

[battery]
warning_threshold = 40

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    name = "Yann"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.4999999888241291
enabled = true
icon_size = 30
reserve_space = false
show_dots = true
show_instance_count = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "Toulouse, France"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 196.0
    cy = 287.0
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 818.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 245.0
    cy = 202.0
    output = "eDP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

[nightlight]
enabled = true
temperature_night = 4400

[osd]
background_opacity = 0.59999998658895493

    [osd.kinds]
    lock_keys = false
    media = false

[plugins]
enabled = [
    "yocraft/battery-widget",
    "dotnetrob/cat",
    "oldirtty/color_picker",
    "kenn/keybind-cheatsheet",
    "h465855hgg/lyrics",
    "8bury/mini-docker",
    "icefish/phone-connect",
    "thepunkoff/pomodoro",
    "weinguyen/procmon",
    "yocraft/qrcode",
    "noctalia/screen_recorder",
    "alexander/screen-toolkit",
    "weinguyen/shell-command",
    "davemhammer/tailscale",
    "noctalia/mpvpaper",
    "noctalia/wallhaven",
    "yocraft/web-launcher",
    "cleboost/zed-provider",
    "noctalia/translator",
    "cleboost/jetbrains-provider"
]

[shell]
corner_radius_scale = 2.0
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.panel]
    control_center_position = "center"
    launcher_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/yann/Pictures/screenshots"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
custom_palette = "alena-aenami-far-from-tomorrow-rb"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [ "vscode", "zed", "fastfetch", "lazygit" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/yann/Pictures/Wallpapers/alena-aenami-cold.jpg"

    [wallpaper.last]
    path = "/home/yann/Pictures/Wallpapers/alena-aenami-cold.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/yann/Pictures/Wallpapers/alena-aenami-cold.jpg"

    [[wallpaper.favorite]]
    path = "/home/yann/Pictures/Wallpapers/2020-12-19 23_42_56-Window.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/yann/Pictures/Wallpapers/backiee-218448-landscape.jpg"
    theme_mode = "auto"

[weather]
refresh_minutes = 5

[widget.clipboard]
enabled = false

[widget.clock]
anchor = true

[widget.control-center]
enabled = false

[widget.cpu]
glyph = "cpu"
visualization = "none"

[widget.input_volume]
show_label = false

[widget.keybinds]
enabled = false
type = "kenn/keybind-cheatsheet:keybinds"

[widget.media]
hide_artist = true
hide_when_no_media = true
max_length = 170

[widget.network]
show_label = false

[widget.network_rx]
visualization = "none"

[widget.network_tx]
visualization = "none"

[widget.ram]
glyph = "section"
stat = "ram_pct"
visualization = "none"

[widget.status]
show_counts = false
type = "davemhammer/tailscale:status"

[widget.sysmon]
glyph = "switch-horizontal"
stat = "swap_pct"
visualization = "none"

[widget.tray]
capsule_opacity = 0.5
detached_panel = true
drawer = true
match_adjacent_spacing = true

[widget.weather]
show_condition = false
